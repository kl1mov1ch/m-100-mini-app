server {
    listen 80;
    listen [::]:80;
    server_name fiat-legacy.online www.fiat-legacy.online;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://fiat-legacy.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fiat-legacy.online www.fiat-legacy.online;
    ssl_certificate /etc/letsencrypt/live/fiat-legacy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fiat-legacy.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    root /var/miniApp/m-100/frontend/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-store;
        try_files $uri $uri/ /index.html;
    }
}
