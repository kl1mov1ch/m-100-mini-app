services:
  app:
    build: .
    restart: unless-stopped
    env_file: deploy/.env.production
    environment:
      APP_ENV: production
      APP_DATABASE: /app/data/m100.sqlite3
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - telegram_bot_token
    volumes:
      - app_data:/app/data
    expose:
      - '8000'
    init: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  certbot:
    image: certbot/certbot:v5.1.0
    profiles: [certificate]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
secrets:
  telegram_bot_token:
    file: ./deploy/secrets/telegram_bot_token
volumes:
  app_data:
