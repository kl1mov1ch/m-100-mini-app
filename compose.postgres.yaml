services:
  app:
    environment:
      APP_STORAGE: postgres
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: m100
      POSTGRES_USER: m100_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=20']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U m100_owner -d m100']
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  database_url:
    file: ./deploy/secrets/database_url
  postgres_owner_password:
    file: ./deploy/secrets/postgres_owner_password

volumes:
  postgres_data:
